<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>Timer Allenamento Master Judoka</title><style>body{margin:0;background:#07111c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:480px;margin:auto;padding:20px;text-align:center}h1{font-size:25px;margin:8px 0 20px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#172536;border-radius:16px;padding:12px 5px}.label{font-size:13px;color:#b8c4d2}.value{font-size:21px;font-weight:700;margin:7px 0}.adjust{display:flex;justify-content:center;gap:10px}button{border:0;color:#fff;font-weight:700;touch-action:manipulation}.small{width:38px;height:38px;border-radius:50%;background:#34475c;font-size:22px}.timerbox{margin:26px auto;width:270px;height:270px;box-sizing:border-box;border:8px solid #22c55e;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.pausePhase .timerbox{border-color:#f59e0b}.phase{font-size:22px;font-weight:800;color:#22c55e}.pausePhase .phase{color:#f59e0b}.clock{font-size:62px;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums}.round{color:#aeb9c6;font-size:15px}.message{height:24px;margin-top:8px;color:#d8e1ea;font-weight:600}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{padding:16px 4px;border-radius:14px;font-size:15px}.start{background:#16a34a}.pause{background:#d98c00}.reset{background:#dc3545}.note{margin-top:18px;color:#8495a8;font-size:12px}</style></head><body><div class='app' id='app'><h1>TIMER ALLENAMENTO<br>MASTER JUDOKA</h1><div class='settings'><div class='card'><div class='label'>Attività</div><div class='value' id='workVal'>03:00</div><div class='adjust'><button class='small' data-action='work-'>−</button><button class='small' data-action='work+'>+</button></div></div><div class='card'><div class='label'>Pausa</div><div class='value' id='restVal'>01:00</div><div class='adjust'><button class='small' data-action='rest-'>−</button><button class='small' data-action='rest+'>+</button></div></div><div class='card'><div class='label'>Sedute</div><div class='value' id='roundVal'>5</div><div class='adjust'><button class='small' data-action='round-'>−</button><button class='small' data-action='round+'>+</button></div></div></div><div class='timerbox'><div class='phase' id='phase'>ATTIVITA</div><div class='clock' id='clock'>03:00</div><div class='round' id='roundText'>Seduta 1 di 5</div></div><div class='message' id='message'>Pronto</div><div class='actions'><button class='action start' id='startButton'>▶ START</button><button class='action pause' id='pauseButton'>Ⅱ PAUSA</button><button class='action reset' id='resetButton'>↻ RESET</button></div></div><script>(()=>{const app=document.getElementById('app'),workVal=document.getElementById('workVal'),restVal=document.getElementById('restVal'),roundVal=document.getElementById('roundVal'),clock=document.getElementById('clock'),phase=document.getElementById('phase'),roundText=document.getElementById('roundText'),message=document.getElementById('message');let workTime=180,restTime=60,totalRounds=5,currentRound=1,currentMode='work',remaining=workTime,running=false,interval=null,endTime=0,audioContext=null,halfAnnounced=false,lastBeepSecond=null,musicTimer=null,musicStep=0,countdownRunning=false;const formatTime=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');function initAudio(){if(!audioContext){const A=window.AudioContext||window.webkitAudioContext;if(A)audioContext=new A()}if(audioContext&&audioContext.state==='suspended')audioContext.resume()}function beep(f=1100,d=.14){initAudio();if(!audioContext)return;const o=audioContext.createOscillator(),g=audioContext.createGain(),n=audioContext.currentTime;o.type='square';o.frequency.value=f;g.gain.value=.8;o.connect(g);g.connect(audioContext.destination);o.start(n);g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.01,n+d);o.stop(n+d)}const bgMusic=new Audio('music.wav');bgMusic.loop=true;bgMusic.preload='auto';bgMusic.volume=.38;function startMusic(){bgMusic.play().catch(()=>{})}function stopMusic(){bgMusic.pause()}function resetMusic(){bgMusic.pause();try{bgMusic.currentTime=0}catch(e){}}function speak(t){return}function render(){workVal.textContent=formatTime(workTime);restVal.textContent=formatTime(restTime);roundVal.textContent=totalRounds;clock.textContent=formatTime(remaining);phase.textContent=currentMode==='work'?'ATTIVITÀ':'PAUSA';roundText.textContent='Seduta '+currentRound+' di '+totalRounds;app.classList.toggle('pausePhase',currentMode==='rest')}function stopTimer(){running=false;stopMusic();if(interval){clearInterval(interval);interval=null}}function beginPhase(){halfAnnounced=false;lastBeepSecond=null;endTime=Date.now()+remaining*1000;if(currentMode==='work'){message.textContent='START!';speak('Start!')}else{message.textContent=restTime+' SECONDS REST';speak(restTime+' seconds rest')}render()}function finishWorkout(){stopTimer();resetMusic();remaining=0;render();phase.textContent='FINE';clock.textContent='00:00';message.textContent='ALLENAMENTO COMPLETATO';beep(900,.15);setTimeout(()=>beep(1100,.15),200);setTimeout(()=>beep(1350,.5),400);setTimeout(()=>speak('Workout complete'),650)}function nextPhase(){if(currentMode==='work'){if(currentRound>=totalRounds){finishWorkout();return}currentMode='rest';remaining=restTime;message.textContent='PAUSA'}else{currentRound++;currentMode='work';remaining=workTime;if(currentRound===totalRounds){halfAnnounced=false;lastBeepSecond=null;endTime=Date.now()+remaining*1000;message.textContent='LAST ROUND!';speak('Last Round!');render();return}}beginPhase()}function tick(){remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));if(currentMode==='work'&&!halfAnnounced&&remaining<=Math.ceil(workTime/2)){halfAnnounced=true;message.textContent='ROUND '+currentRound+'!';speak('Round '+currentRound+'!')}if(remaining<=5&&remaining>=1&&remaining!==lastBeepSecond){lastBeepSecond=remaining;beep(remaining===1?1400:1100,.16);message.textContent=String(remaining)}render();if(remaining<=0)nextPhase()}function startTimer(){initAudio();if(running||countdownRunning)return;if(currentMode==='work'&&remaining===workTime&&currentRound===1){countdownRunning=true;const steps=[['FIVE','Five!',0,980,false],['FOUR','Four!',1150,1040,false],['THREE','Three!',2300,1120,false],['TWO','Two!',3000,1200,false],['ONE','One!',3650,1320,false],['GO!','Go!',4300,1580,true]];steps.forEach(([txt,voice,delay,freq,isGo])=>setTimeout(()=>{message.textContent=txt;beep(freq,isGo?.26:.13);speak(voice);if(isGo){countdownRunning=false;running=true;halfAnnounced=false;lastBeepSecond=null;endTime=Date.now()+remaining*1000;interval=setInterval(tick,100);startMusic()}},delay));return}running=true;endTime=Date.now()+remaining*1000;if(currentMode==='work'&&remaining===workTime){halfAnnounced=false;lastBeepSecond=null;message.textContent='START!';speak('Start!')}interval=setInterval(tick,100);startMusic()}function pauseTimer(){if(!running)return;remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));stopTimer();message.textContent='Timer in pausa';render()}function resetTimer(){stopTimer();resetMusic();currentRound=1;currentMode='work';remaining=workTime;halfAnnounced=false;lastBeepSecond=null;message.textContent='Pronto';render()}app.addEventListener('click',e=>{const a=e.target.dataset.action;if(!a||running)return;if(a==='work-')workTime=Math.max(10,workTime-10);if(a==='work+')workTime=Math.min(3600,workTime+10);if(a==='rest-')restTime=Math.max(10,restTime-10);if(a==='rest+')restTime=Math.min(1800,restTime+10);if(a==='round-')totalRounds=Math.max(1,totalRounds-1);if(a==='round+')totalRounds=Math.min(50,totalRounds+1);resetTimer()});document.getElementById('startButton').addEventListener('click',startTimer);document.getElementById('pauseButton').addEventListener('click',pauseTimer);document.getElementById('resetButton').addEventListener('click',resetTimer);render()})();</script></body></html>
